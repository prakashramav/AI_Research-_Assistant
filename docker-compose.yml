version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: research_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-tavily}
      - MOCK_MODE=${MOCK_MODE:-false}
      - DATABASE_URL=sqlite:////app/data/research_assistant.db
      - VECTOR_DB_PATH=/app/vector_store
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-3-5-sonnet-20241022}
    volumes:
      - research_data:/app/data
      - research_vectors:/app/vector_store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: research_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

volumes:
  research_data:
  research_vectors:
